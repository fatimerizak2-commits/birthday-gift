<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <!-- Decorative Stickers -->
    <img src="images/cat.png" class="sticker cat" alt="Cat">
    <img src="images/lilies.png" class="sticker lilies" alt="Flowers">
    <img src="images/flower.png" class="sticker flower" alt="Flower">
    <!--<img src="images/teddy.png" class="sticker teddy" alt="Teddy Bear">-->
    <img src="images/teddy.png" class="sticker kiss" alt="Kiss">

    <!-- Main Content -->
    <main class="container">

        <h1>
            Happy Birthday
        </h1>

        <p class="subtitle">
            I made something special just for you ❤️
        </p>

        <!-- Envelope -->
        <div class="envelope" id="envelope">

            <div class="back"></div>

            <div class="bottom"></div>

            <div class="left"></div>

            <div class="right"></div>

            <div class="top"></div>

            <div class="seal"></div>

        </div>

        <p class="click">
            Click the envelope ✨
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
