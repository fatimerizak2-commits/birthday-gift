<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For You ❤️</title>

    <link rel="stylesheet" href="message.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <!-- Decorations -->
    <img src="images/flower1.png" class="sticker flower1" alt="">
    <img src="images/flower2.png" class="sticker flower2" alt="">
    <img src="images/flower3.png" class="sticker flower3" alt="">
    <img src="images/butterfly.png" class="sticker butterfly" alt="">

    <!-- Main -->
    <main class="container">

        <h1>A Letter For You</h1>

        <!--<p class="subtitle">
            Some words are only meant for your heart ❤️
        </p>-->

        <!-- Polaroid Photos -->

        <div class="photo photo1">
            <div class="tape"></div>
            <img src="images/myftitih.jpg" alt="">
        </div>

        <div class="photo photo2">
            <div class="tape"></div>
            <img src="images/us2.jpeg" alt="">
        </div>

        <div class="photo photo3">
            <div class="tape"></div>
            <img src="images/us3.jpeg" alt="">
        </div>

        <div class="photo photo4">
            <div class="tape"></div>
            <img src="images/us4.jpeg" alt="">
        </div>

        <!-- Envelope Section -->

        <section class="letter-wrapper">

            <!-- Letter Preview -->

            <div class="letter">

                <h3>Dear Fathallah ❤️</h3>

                <p>
                    There are so many things I'd love
                    to tell you...
                </p>

            </div>

            <!-- Envelope -->

            <div class="envelope">

                <div class="back"></div>

                <div class="front"></div>

                <div class="flap"></div>

                <div class="seal">❤</div>

            </div>

            <!-- Open Letter Button -->

            <button id="openLetter">

                💌 Open Letter

            </button>

            <!-- Back Button -->

            <p id="backBtn" class="back-click">

                ← Back

            </p>

        </section>

    </main>

    <script src="message.js"></script>

</body>

</html>
