<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="cake.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <!-- Decorations -->

    <!--<img src="images/lvy.png" class="sticker flower1" alt="">
    <img src="images/man.png" class="sticker flower2" alt="">
    <img src="images/us.png" class="sticker butterfly" alt="">-->

    <main class="content">

        <p class="date">
            26 • 07 • 06
        </p>

        <h1>

            Happy Birthday

            <span>Fathallah ❤️</span>

        </h1>

        <p class="subtitle">

            Today is your special day.
            I hope your smile never fades.

        </p>

        <!-- Cake -->

        <div class="cake-section">

            <img src="images/batmancake.png" class="cake" alt="Birthday Cake">

        </div>

        <!-- Favorite Photo -->

        <div class="memory">

            <img src="images/finalpic.png" alt="">

        </div>

        <!-- Final Message -->

        <div class="final-message">

            <p>
                Happy birthday BATMAN, love u my lovely man.

            </p>

            <p>

                I hope this little surprise
                made your birthday
                a little happier.

            </p>

        </div>

        <!-- Music -->

        <audio controls class="music">

            <source src="music/Maher zain.mp3" type="audio/mpeg">

        </audio>

        <!-- Finish -->

        <p class="finish">

            The End ❤️

        </p>

        <p class="back" id="backBtn">

            ← Back

        </p>

    </main>

    <script src="cake.js"></script>

</body>

</html>
