<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories ❤️</title>

    <link rel="stylesheet" href="memories.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <!-- Decorations -->
    <img src="images/flower1.png" class="sticker flower1" alt="">
    <img src="images/flower2.png" class="sticker flower2" alt="">
    <img src="images/butterfly.png" class="sticker butterfly" alt="">

    <main class="content">

        <p class="date">
            Our Favorite Moments
        </p>

        <h1>
            Our Memories
            <span>❤️ Together ❤️</span>
        </h1>

        <p class="subtitle">
            Every picture tells a little part of our story.
        </p>

        <!-- Gallery -->

        <section class="gallery">

            <div class="photo">
                <img src="images/uss.jpg" alt="">
                <p>"The beginning."</p>
            </div>

            <div class="photo">
                <img src="images/oo.jpeg" alt="">
                <p>"My favorite smile."</p>
            </div>

            <div class="photo">
                <img src="images/wow.jpeg" alt="">
                <p>"Forever a memory."</p>
            </div>

            <div class="photo">
                <img src="images/gg.jpeg" alt="">
                <p>"You make life brighter."</p>
            </div>

            <div class="photo">
                <img src="images/bb.jpeg" alt="">
                <p>"Always us."</p>
            </div>

            <div class="photo">
                <img src="images/ff.jpeg" alt="">
                <p>"One of my favorite days."</p>
            </div>

        </section>

        <p class="quote">

            "Every memory with you is my favorite."

        </p>
        <p class="back" id="backBtn">

            ← Back

        </p>

    </main>

    <script src="memories.js"></script>

</body>

</html>
